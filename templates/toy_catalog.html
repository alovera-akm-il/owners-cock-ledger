<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
<title>Owner's Cock Ledger — {{ submissive_display_name }}'s Toys</title>
<link href="/static/css/fonts.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet">
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/notifications.js" defer></script>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100">

<nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a class="flex items-center gap-2 font-semibold tracking-tight" href="/dashboard">
        <img src="/static/images/logo.png" class="h-8 w-auto" alt="Owner's Cock Ledger" />
        <span class="hidden sm:inline">Owner's Cock Ledger</span>
      </a>
      <div class="hidden lg:flex items-center gap-6 text-sm">
        <a href="/dashboard" class="text-slate-400 hover:text-slate-200">Submissives</a>
        <a href="/keyholder/catalog" class="text-slate-400 hover:text-slate-200">Catalog</a>
        <a href="/keyholder/review" class="text-slate-400 hover:text-slate-200">Review queue</a>
        <a href="/keyholder/safety-alerts" class="text-slate-400 hover:text-slate-200">Safety Alerts</a>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="relative">
        <button id="notif-bell-btn" class="relative text-slate-400 hover:text-slate-200 p-1.5" title="Notifications">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" /></svg>
          <span id="notif-badge" class="hidden absolute -top-0.5 -right-0.5 h-4 min-w-[1rem] px-1 rounded-full bg-amber-600 text-[10px] leading-4 text-center font-semibold text-slate-950">0</span>
        </button>
        <div id="notif-panel" class="hidden absolute right-0 mt-2 w-80 max-h-96 overflow-y-auto rounded-xl border border-slate-800 bg-slate-900 shadow-xl z-20">
          <div class="flex items-center justify-between px-3 py-2 border-b border-slate-800">
            <span class="text-xs font-semibold">Notifications</span>
            <button id="notif-mark-all-btn" class="text-[11px] text-amber-500 hover:text-amber-400">Mark all read</button>
          </div>
          <div id="notif-panel-list"></div>
        </div>
      </div>
      <button id="notif-enable-push-btn" class="hidden text-[11px] font-medium text-slate-400 hover:text-slate-200 border border-slate-800 rounded-lg px-2 py-1">Enable push</button>
      <span class="hidden sm:inline-block text-xs px-2 py-1 rounded-full bg-amber-600/10 text-amber-500 border border-amber-600/30 font-medium">Keyholder</span>
      <a href="/account" title="Profile & security" class="hidden sm:inline text-sm text-slate-300 hover:text-slate-100">{{ display_name }}</a>
      <a href="/account" title="Profile & security" class="h-8 w-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-semibold hover:bg-slate-600">{{ initial }}</a>
      <button id="logout-btn" class="text-xs font-medium text-slate-400 hover:text-slate-200 px-2 py-1">Log out</button>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-8" data-submissive-id="{{ submissive_id }}">
  <div>
    <a href="/keyholder/submissives/{{ submissive_id }}" class="text-xs text-slate-500 hover:text-slate-300">&larr; Back to {{ submissive_display_name }}</a>
  </div>
  <div class="flex items-center justify-between mb-2 mt-1">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Toy Catalog</h1>
      <p class="text-sm text-slate-400 mt-1">{{ submissive_display_name }}'s inventory — either of you can add, only you can retire</p>
    </div>
    <button id="new-btn" class="rounded-lg bg-amber-600 hover:bg-amber-500 transition-colors px-4 py-2 text-sm font-semibold text-slate-950">+ Add toy</button>
  </div>

  <label class="flex items-center gap-1.5 text-xs text-slate-500 mb-6">
    <input id="show-retired" type="checkbox"> Show retired
  </label>

  <div id="new-form" class="hidden rounded-xl border border-amber-700/40 bg-amber-500/5 p-5 mb-6 space-y-4">
    <p id="form-heading" class="text-xs font-semibold uppercase tracking-wide text-amber-500">Add toy</p>
    <input type="hidden" id="edit-toy-id" value="" />
    <div id="form-message" class="hidden rounded-lg px-3 py-2 text-xs"></div>
    <div class="grid sm:grid-cols-2 gap-3">
      <input id="f-name" type="text" placeholder="Name" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="f-category" type="text" placeholder="Category (e.g. Vibrator, Chastity, Impact)" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
    </div>
    <div class="grid sm:grid-cols-3 gap-3">
      <input id="f-material" type="text" placeholder="Material" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="f-brand" type="text" placeholder="Brand" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="f-color" type="text" placeholder="Color" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      <input id="f-size-notes" type="text" placeholder="Size notes (length, diameter, etc.)" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="f-storage-location" type="text" placeholder="Storage location" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
    </div>
    <textarea id="f-care-instructions" rows="2" placeholder="Care instructions" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200"></textarea>
    <textarea id="f-usage-notes" rows="2" placeholder="Usage notes (e.g. requires extra lubricant, check battery before use)" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200"></textarea>
    <input id="f-tags" type="text" placeholder="Tags, comma separated (e.g. travel-friendly, quiet)" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
    <div class="flex justify-end gap-2">
      <button id="cancel-new" type="button" class="text-xs font-medium text-slate-400 px-3 py-2">Cancel</button>
      <button id="save-toy-btn" class="text-xs font-semibold text-slate-950 bg-amber-600 hover:bg-amber-500 rounded-lg px-4 py-2">Save toy</button>
    </div>
  </div>

  <div id="toy-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <p class="text-sm text-slate-500 col-span-full">Loading…</p>
  </div>
</main>

<script>
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }
  const subId = $('main').data('submissive-id');
  function apiCall(method, path, body) {
    return $.ajax({
      url: path, method: method, contentType: 'application/json',
      headers: { 'X-CSRF-Token': getCookie('ocl_csrf') || '' },
      data: body !== undefined ? JSON.stringify(body) : undefined,
    });
  }
  function errorMessage(xhr, fallback) {
    return (xhr.responseJSON && xhr.responseJSON.error && xhr.responseJSON.error.message) || fallback;
  }

  $('#logout-btn').on('click', function () {
    apiCall('POST', '/api/v1/auth/logout').always(function () { window.location = '/login'; });
  });

  function resetForm() {
    $('#edit-toy-id').val('');
    $('#form-heading').text('Add toy');
    $('#form-message').addClass('hidden');
    ['name', 'category', 'material', 'brand', 'color', 'size-notes', 'storage-location', 'care-instructions', 'usage-notes', 'tags']
      .forEach(function (f) { $('#f-' + f).val(''); });
  }

  $('#new-btn').on('click', function () {
    resetForm();
    $('#new-form').removeClass('hidden').addClass('panel-fade')[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('#cancel-new').on('click', function () { $('#new-form').addClass('hidden'); });

  function openEditForm(t) {
    $('#edit-toy-id').val(t.id);
    $('#form-heading').text('Editing toy');
    $('#form-message').addClass('hidden');
    $('#f-name').val(t.name || '');
    $('#f-category').val(t.category || '');
    $('#f-material').val(t.material || '');
    $('#f-brand').val(t.brand || '');
    $('#f-color').val(t.color || '');
    $('#f-size-notes').val(t.size_notes || '');
    $('#f-storage-location').val(t.storage_location || '');
    $('#f-care-instructions').val(t.care_instructions || '');
    $('#f-usage-notes').val(t.usage_notes || '');
    $('#f-tags').val((t.tags || []).join(', '));
    $('#new-form').removeClass('hidden').addClass('panel-fade')[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  $('#save-toy-btn').on('click', function () {
    const id = $('#edit-toy-id').val();
    const name = $('#f-name').val();
    if (!name) {
      $('#form-message').attr('class', 'rounded-lg px-3 py-2 text-xs bg-red-600/10 border border-red-600/30 text-red-300').text('Name is required.').removeClass('hidden');
      return;
    }
    const tags = $('#f-tags').val().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    const payload = {
      name: name,
      category: $('#f-category').val() || null,
      material: $('#f-material').val() || null,
      brand: $('#f-brand').val() || null,
      color: $('#f-color').val() || null,
      size_notes: $('#f-size-notes').val() || null,
      storage_location: $('#f-storage-location').val() || null,
      care_instructions: $('#f-care-instructions').val() || null,
      usage_notes: $('#f-usage-notes').val() || null,
      tags: tags.length ? tags : null,
    };
    const request = id
      ? apiCall('PATCH', '/api/v1/toys/' + id, payload)
      : apiCall('POST', '/api/v1/keyholder/submissives/' + subId + '/toys', payload);
    request.done(function () {
      $('#new-form').addClass('hidden');
      loadToys();
    }).fail(function (xhr) {
      $('#form-message').attr('class', 'rounded-lg px-3 py-2 text-xs bg-red-600/10 border border-red-600/30 text-red-300').text(errorMessage(xhr, 'Could not save toy.')).removeClass('hidden');
    });
  });

  function toyCard(t) {
    const $card = $('<div>').addClass('rounded-xl border overflow-hidden ' + (t.retirement_requested_at ? 'border-amber-700/40 bg-amber-500/5' : 'border-slate-800 bg-slate-900') + (t.retired_at ? ' opacity-50' : ''));
    const $body = $('<div class="p-4">');
    const $head = $('<div class="flex items-start justify-between">');
    $head.append($('<p class="text-sm font-medium">').text(t.name));
    $body.append($head);
    const meta = [t.category, t.material, t.brand].filter(Boolean).join(' · ');
    if (meta) $body.append($('<p class="text-xs text-slate-500 mt-0.5">').text(meta));
    if (t.size_notes) $body.append($('<p class="text-xs text-slate-500">').text(t.size_notes));
    if (t.storage_location) $body.append($('<p class="text-xs text-slate-600">').text('Stored: ' + t.storage_location));
    if (t.usage_notes) $body.append($('<p class="text-xs text-slate-600">').text('Usage: ' + t.usage_notes));
    if (t.tags && t.tags.length) {
      const $tags = $('<div class="flex flex-wrap gap-1 mt-2">');
      t.tags.forEach(function (tag) { $tags.append($('<span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded-full">').text(tag)); });
      $body.append($tags);
    }
    if (t.retired_at) {
      $body.append($('<span class="inline-block mt-2 text-[10px] font-semibold text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">').text('retired'));
    } else if (t.retirement_requested_at) {
      $body.append($('<span class="inline-block mt-2 text-[10px] font-semibold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full">').text('removal requested'));
      const $actions = $('<div class="flex gap-2 mt-3">');
      const $decline = $('<button class="flex-1 text-xs font-medium text-slate-300 border border-slate-700 hover:border-slate-600 hover:bg-slate-800 rounded-lg px-2 py-1.5">').text('Decline');
      $decline.on('click', function () {
        apiCall('POST', '/api/v1/keyholder/toys/' + t.id + '/decline-removal').done(loadToys);
      });
      const $approve = $('<button class="flex-1 text-xs font-semibold text-slate-950 bg-amber-500 hover:bg-amber-400 rounded-lg px-2 py-1.5">').text('Approve & retire');
      $approve.on('click', function () {
        apiCall('POST', '/api/v1/keyholder/toys/' + t.id + '/retire').done(loadToys);
      });
      $actions.append($decline, $approve);
      $body.append($actions);
    } else {
      const $actions = $('<div class="flex gap-2 mt-3">');
      const $edit = $('<button class="flex-1 text-xs font-medium text-slate-300 border border-slate-700 hover:border-slate-600 hover:bg-slate-800 rounded-lg px-2 py-1.5">').text('Edit');
      $edit.on('click', function () { openEditForm(t); });
      const $retire = $('<button class="text-xs font-medium text-red-400 border border-red-800/60 hover:bg-red-500/10 rounded-lg px-2 py-1.5">').text('Retire');
      $retire.on('click', function () {
        if (!confirm('Retire "' + t.name + '"? It stays visible in past history but drops out of the active catalog.')) return;
        apiCall('POST', '/api/v1/keyholder/toys/' + t.id + '/retire').done(loadToys);
      });
      $actions.append($edit, $retire);
      $body.append($actions);
    }
    $card.append($body);
    return $card;
  }

  function loadToys() {
    const includeRetired = $('#show-retired').is(':checked');
    apiCall('GET', '/api/v1/keyholder/submissives/' + subId + '/toys' + (includeRetired ? '?include_retired=true' : '')).done(function (list) {
      const $grid = $('#toy-grid').empty();
      if (list.length === 0) {
        $grid.append($('<p class="text-sm text-slate-500 col-span-full">').text('No toys in the catalog yet.'));
        return;
      }
      list.forEach(function (t) { $grid.append(toyCard(t)); });
    });
  }
  $('#show-retired').on('change', loadToys);
  loadToys();
</script>
</body>
</html>
