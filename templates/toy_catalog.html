<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
<title>Owner's Cock Ledger — {{ submissive_display_name }}'s Toys</title>
<link href="/static/css/fonts.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet">
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/app-shell.js"></script>
<script src="/static/js/notifications.js" defer></script>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100">

{% include "partials/nav.html" %}

{% include "partials/submissive_subnav.html" %}

<main class="max-w-6xl mx-auto px-6 py-8"
      data-role="keyholder"
      data-list-endpoint="/api/v1/keyholder/submissives/{{ submissive_id }}/toys"
      data-devices-endpoint="/api/v1/keyholder/submissives/{{ submissive_id }}/devices"
      data-limit-ratings-endpoint="/api/v1/keyholder/submissives/{{ submissive_id }}/limit-ratings">
  <div>
    <a href="/keyholder/submissives/{{ submissive_id }}" class="text-xs text-slate-500 hover:text-slate-300">&larr; Back to {{ submissive_display_name }}</a>
  </div>
  <div class="flex items-center justify-between mb-2 mt-1">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Toy Catalog</h1>
      <p class="text-sm text-slate-400 mt-1">{{ submissive_display_name }}'s inventory — either of you can add, only you can retire</p>
    </div>
    <button id="new-btn" class="rounded-lg bg-amber-600 hover:bg-amber-500 transition-colors px-4 py-2 text-sm font-semibold text-slate-950">+ Add toy</button>
  </div>

  <label class="flex items-center gap-1.5 text-xs text-slate-500 mb-6">
    <input id="show-retired" type="checkbox"> Show retired
  </label>

  <div id="new-form" class="hidden rounded-xl border border-amber-700/40 bg-amber-500/5 p-5 mb-6 space-y-4">
    <p id="form-heading" class="text-xs font-semibold uppercase tracking-wide text-amber-500">Add toy</p>
    <input type="hidden" id="edit-toy-id" value="" />
    <div id="form-message" class="hidden rounded-lg px-3 py-2 text-xs"></div>
    <div class="grid sm:grid-cols-2 gap-3">
      <input id="f-name" type="text" placeholder="Name" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="f-category" type="text" placeholder="Category (e.g. Vibrator, Chastity, Impact)" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
    </div>
    <div id="limit-warning" class="hidden rounded-lg px-3 py-2 text-xs bg-red-600/10 border border-red-600/30 text-red-300"></div>
    <div class="grid sm:grid-cols-3 gap-3">
      <input id="f-material" type="text" placeholder="Material" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="f-brand" type="text" placeholder="Brand" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="f-color" type="text" placeholder="Color" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      <input id="f-size-notes" type="text" placeholder="Size notes (length, diameter, etc.)" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="f-storage-location" type="text" placeholder="Storage location" class="bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">Compatible device</label>
        <select id="f-compatible-device" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200">
          <option value="">Not device-specific</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">Acquired (optional)</label>
        <input id="f-acquired-at" type="date" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      </div>
    </div>
    <textarea id="f-care-instructions" rows="2" placeholder="Care instructions" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200"></textarea>
    <textarea id="f-usage-notes" rows="2" placeholder="Usage notes (e.g. requires extra lubricant, check battery before use)" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200"></textarea>
    <input id="f-tags" type="text" placeholder="Tags, comma separated (e.g. travel-friendly, quiet)" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />

    <div id="photo-section" class="hidden border-t border-slate-800 pt-3">
      <label class="block text-xs font-medium text-slate-400 mb-1.5">Photo</label>
      <img id="photo-preview" class="hidden h-24 w-24 object-cover rounded-lg border border-slate-800 mb-2" alt="" />
      <div class="flex items-center gap-2">
        <input id="f-photo" type="file" accept="image/jpeg,image/png"
          class="text-xs text-slate-300 file:mr-2 file:rounded-lg file:border-0 file:bg-slate-800 file:px-3 file:py-1.5 file:text-slate-200 file:text-xs" />
        <button id="remove-photo-btn" type="button" class="hidden text-xs font-medium text-red-400 hover:text-red-300 whitespace-nowrap">Remove photo</button>
      </div>
      <p id="photo-message" class="hidden text-xs mt-1.5"></p>
    </div>
    <p id="photo-save-first-note" class="text-xs text-slate-600">Save the toy first, then add a photo.</p>

    <div class="flex justify-end gap-2">
      <button id="cancel-new" type="button" class="text-xs font-medium text-slate-400 px-3 py-2">Cancel</button>
      <button id="save-toy-btn" class="text-xs font-semibold text-slate-950 bg-amber-600 hover:bg-amber-500 rounded-lg px-4 py-2">Save toy</button>
    </div>
  </div>

  <div id="toy-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <p class="text-sm text-slate-500 col-span-full">Loading…</p>
  </div>
</main>

<script src="/static/js/toy_catalog.js"></script>
</body>
</html>
