<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
<title>Owner's Cock Ledger — Play Sessions</title>
<link href="/static/css/fonts.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet">
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/notifications.js" defer></script>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100">

<nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a class="flex items-center gap-2 font-semibold tracking-tight" href="/submissive">
        <img src="/static/images/logo.png" class="h-8 w-auto" alt="Owner's Cock Ledger" />
        <span class="hidden sm:inline">Owner's Cock Ledger</span>
      </a>
      <div class="hidden lg:flex items-center gap-6 text-sm">
        <a href="/submissive" class="text-slate-400 hover:text-slate-200">My Status</a>
        <a href="/submissive/submit-proof" class="text-slate-400 hover:text-slate-200">Submit Proof</a>
        <a href="/submissive/toys" class="text-slate-400 hover:text-slate-200">My Toys</a>
        <a href="/submissive/play-sessions" class="text-slate-100 font-medium">Play Sessions</a>
        <a href="/submissive/limits" class="text-slate-400 hover:text-slate-200">My Limits</a>
        <a href="/submissive/statistics" class="text-slate-400 hover:text-slate-200">Statistics</a>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="relative">
        <button id="notif-bell-btn" class="relative text-slate-400 hover:text-slate-200 p-1.5" title="Notifications">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" /></svg>
          <span id="notif-badge" class="hidden absolute -top-0.5 -right-0.5 h-4 min-w-[1rem] px-1 rounded-full bg-amber-600 text-[10px] leading-4 text-center font-semibold text-slate-950">0</span>
        </button>
        <div id="notif-panel" class="hidden absolute right-0 mt-2 w-80 max-h-96 overflow-y-auto rounded-xl border border-slate-800 bg-slate-900 shadow-xl z-20">
          <div class="flex items-center justify-between px-3 py-2 border-b border-slate-800">
            <span class="text-xs font-semibold">Notifications</span>
            <button id="notif-mark-all-btn" class="text-[11px] text-amber-500 hover:text-amber-400">Mark all read</button>
          </div>
          <div id="notif-panel-list"></div>
        </div>
      </div>
      <button id="notif-enable-push-btn" class="hidden text-[11px] font-medium text-slate-400 hover:text-slate-200 border border-slate-800 rounded-lg px-2 py-1">Enable push</button>
      <span class="hidden sm:inline-block text-xs px-2 py-1 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/30 font-medium">Submissive</span>
      <a href="/account" title="Profile & security" class="hidden sm:inline text-sm text-slate-300 hover:text-slate-100">{{ display_name }}</a>
      <a href="/account" title="Profile & security" class="h-8 w-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-semibold hover:bg-slate-600">{{ initial }}</a>
      <button id="logout-btn" class="text-xs font-medium text-slate-400 hover:text-slate-200 px-2 py-1">Log out</button>
    </div>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-6 py-8">
  <h1 class="text-2xl font-semibold tracking-tight mb-1">Play Sessions</h1>
  <p class="text-sm text-slate-400 mb-6">Your Keyholder assigns these — you can start and end one yourself, and log check-ins along the way.</p>

  <div id="live-banner" class="hidden rounded-xl border border-emerald-700/40 bg-emerald-500/5 p-4 mb-6 flex items-center justify-between">
    <div>
      <p id="live-banner-title" class="text-sm font-medium text-emerald-400 flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-emerald-400 pulse-live"></span></p>
      <p id="live-banner-sub" class="text-xs text-slate-400 mt-0.5"></p>
    </div>
    <a id="live-banner-link" href="#" class="text-xs font-semibold text-slate-950 bg-emerald-500 hover:bg-emerald-400 rounded-lg px-3 py-1.5 whitespace-nowrap">Open →</a>
  </div>

  <div id="session-list" class="rounded-xl border border-slate-800 bg-slate-900 divide-y divide-slate-800">
    <div class="px-5 py-6 text-center text-sm text-slate-500">Loading…</div>
  </div>
</main>

<script>
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function apiCall(method, path, body) {
    return $.ajax({
      url: path, method: method, contentType: 'application/json',
      headers: { 'X-CSRF-Token': getCookie('ocl_csrf') || '' },
      data: body !== undefined ? JSON.stringify(body) : undefined,
    });
  }

  $('#logout-btn').on('click', function () {
    apiCall('POST', '/api/v1/auth/logout').always(function () { window.location = '/login'; });
  });

  const STATUS_LABEL = {
    scheduled: ['scheduled', 'bg-slate-800 text-slate-400'],
    in_progress: ['in progress', 'bg-emerald-500/10 text-emerald-400'],
    pending_judgement: ['awaiting judgement', 'bg-amber-500/10 text-amber-400'],
    completed: ['completed', 'bg-slate-800 text-slate-400'],
    cancelled: ['cancelled', 'bg-slate-800 text-slate-500'],
  };

  function sessionRow(s) {
    const $a = $('<a class="flex items-center justify-between px-5 py-4 hover:bg-slate-800/40">').attr('href', '/submissive/play-sessions/' + s.id);
    const $left = $('<div>');
    $left.append($('<p class="text-sm font-medium">').text(s.title));
    const sub = s.started_at ? ('Started ' + new Date(s.started_at).toLocaleString())
      : ('Scheduled — assigned ' + new Date(s.assigned_at).toLocaleString());
    $left.append($('<p class="text-xs text-slate-500 mt-0.5">').text(sub));
    $a.append($left);
    const label = STATUS_LABEL[s.status] || [s.status, 'bg-slate-800 text-slate-400'];
    const $badge = $('<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full inline-flex items-center gap-1.5">').addClass(label[1]);
    if (s.status === 'in_progress') $badge.append('<span class="h-1.5 w-1.5 rounded-full bg-emerald-400 pulse-live"></span>');
    $badge.append(document.createTextNode(label[0]));
    $a.append($badge);
    return $a;
  }

  function loadSessions() {
    apiCall('GET', '/api/v1/submissive/play-sessions').done(function (list) {
      const $list = $('#session-list').empty();
      if (list.length === 0) {
        $list.append($('<div class="px-5 py-6 text-center text-sm text-slate-500">').text('No play sessions yet.'));
      } else {
        list.forEach(function (s) { $list.append(sessionRow(s)); });
      }

      const live = list.find(function (s) { return s.status === 'in_progress'; });
      if (live) {
        $('#live-banner-title').append(document.createTextNode(live.title + ' is live now'));
        $('#live-banner-sub').text('Started ' + new Date(live.started_at).toLocaleString());
        $('#live-banner-link').attr('href', '/submissive/play-sessions/' + live.id);
        $('#live-banner').removeClass('hidden');
      }
    });
  }
  loadSessions();
</script>
</body>
</html>
