<p class="text-xs font-medium text-slate-400" data-target-date-label data-target-date-epoch="{{ target_release_at_epoch.unwrap() }}"></p>
<div class="rounded-lg bg-slate-950 border border-slate-800 px-3 py-2.5 mt-2 inline-block" data-target-epoch="{{ target_release_at_epoch.unwrap() }}" data-server-now-epoch="{{ server_now_epoch }}">
  <div class="grid grid-cols-[1fr_10px_1fr_10px_1fr_10px_1fr] font-mono font-bold text-xl text-slate-100 tabular-nums{% if overdue %} text-red-400{% endif %}">
    <span data-cd="days" class="text-center">00</span><span class="text-slate-700 text-center">:</span><span data-cd="hours" class="text-center">00</span><span class="text-slate-700 text-center">:</span><span data-cd="minutes" class="text-center">00</span><span class="text-slate-700 text-center">:</span><span data-cd="seconds" class="text-center">00</span>
  </div>
  <div class="grid grid-cols-[1fr_10px_1fr_10px_1fr_10px_1fr] text-[9px] uppercase tracking-wide text-slate-500 mt-1">
    <span class="text-center">days</span><span></span><span class="text-center">hrs</span><span></span><span class="text-center">min</span><span></span><span class="text-center">sec</span>
  </div>
  <p data-cd="overdue-label" class="{% if !overdue %}hidden {% endif %}text-[10px] text-red-400 font-semibold mt-1 text-center">overdue</p>
</div>
