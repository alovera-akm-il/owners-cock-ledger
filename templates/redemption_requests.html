<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
<title>Owner's Cock Ledger — Redemptions</title>
<link href="/static/css/fonts.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet">
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/app-shell.js"></script>
<script src="/static/js/notifications.js" defer></script>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100">

{% include "partials/nav.html" %}

<main class="max-w-4xl mx-auto px-6 py-8">
  <div class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight">Redemptions</h1>
    <p class="text-sm text-slate-400 mt-1">Pending reward redemption requests across everyone currently linked to you.</p>
  </div>

  <div id="requests-list" class="space-y-4 mb-8">
    <p class="text-sm text-slate-500">Loading…</p>
  </div>

  <div>
    <h2 class="text-sm font-semibold text-slate-400 mb-3">Recently decided</h2>
    <div id="decided-list" class="rounded-xl border border-slate-800 bg-slate-900 divide-y divide-slate-800"></div>
  </div>
</main>

<script>

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    const hours = Math.round(mins / 60);
    if (hours < 24) return hours + 'h ago';
    return new Date(iso).toLocaleString();
  }

  function renderRequest(r) {
    const $row = $('<div class="rounded-xl border border-amber-700/40 bg-amber-500/5 p-5 flex items-center justify-between gap-4">');
    const $left = $('<div>');
    $left.append($('<p class="text-sm font-semibold">').text(r.submissive_display_name));
    $left.append($('<p class="text-sm text-slate-300 mt-0.5">').text('Wants to redeem "' + r.reward_title + '" for ' + r.points_cost + ' points'));
    $left.append($('<p class="text-xs text-slate-500 mt-1">').text('Requested ' + timeAgo(r.requested_at)));
    $row.append($left);

    const $actions = $('<div class="flex gap-2 shrink-0">');
    const $deny = $('<button class="text-xs font-medium text-slate-300 border border-slate-700 hover:border-slate-600 hover:bg-slate-800 rounded-lg px-3 py-1.5">').text('Deny');
    $deny.on('click', function () {
      apiCall('PATCH', '/api/v1/keyholder/reward-redemption-requests/' + r.id, { decision: 'deny' }).done(loadRequests);
    });
    const $approve = $('<button class="text-xs font-semibold text-slate-950 bg-amber-500 hover:bg-amber-400 rounded-lg px-3 py-1.5">').text('Approve');
    $approve.on('click', function () {
      apiCall('PATCH', '/api/v1/keyholder/reward-redemption-requests/' + r.id, { decision: 'approve' }).done(loadRequests);
    });
    $actions.append($deny, $approve);
    $row.append($actions);
    return $row;
  }

  function renderDecided(r) {
    const $row = $('<div class="px-5 py-3 flex items-center justify-between gap-4 text-sm">');
    const $left = $('<div class="min-w-0">');
    $left.append($('<p>').append(
      $('<span class="font-medium">').text(r.submissive_display_name),
      $('<span class="text-slate-500">').text(' — "' + r.reward_title + '" for ' + r.points_cost + ' points'),
    ));
    $left.append($('<p class="text-xs text-slate-500 mt-0.5">').text('Decided ' + (r.decided_at ? timeAgo(r.decided_at) : '')));
    $row.append($left);
    const cls = r.status === 'approved' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400';
    $row.append($('<span class="text-xs font-semibold px-2 py-0.5 rounded-full shrink-0 ' + cls + '">').text(r.status));
    return $row;
  }

  function loadRequests() {
    apiCall('GET', '/api/v1/keyholder/reward-redemption-requests').done(function (list) {
      const $list = $('#requests-list').empty();
      const pending = list.filter(function (r) { return r.status === 'pending'; });
      if (pending.length === 0) {
        $list.append('<p class="text-sm text-slate-500">Nothing pending — everyone\'s all caught up.</p>');
      } else {
        pending.forEach(function (r) { $list.append(renderRequest(r)); });
      }

      const $decided = $('#decided-list').empty();
      const decided = list
        .filter(function (r) { return r.status !== 'pending'; })
        .sort(function (a, b) { return new Date(b.decided_at) - new Date(a.decided_at); })
        .slice(0, 10);
      if (decided.length === 0) {
        $decided.append('<p class="px-5 py-4 text-sm text-slate-500">Nothing decided yet.</p>');
      } else {
        decided.forEach(function (r) { $decided.append(renderDecided(r)); });
      }
    });
  }
  loadRequests();
</script>
</body>
</html>
