<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
<title>Owner's Cock Ledger — {{ submissive_display_name }}'s Statistics</title>
<link href="/static/css/fonts.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet">
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/app-shell.js"></script>
<script src="/static/js/notifications.js" defer></script>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100">

{% include "partials/nav.html" %}

{% include "partials/submissive_subnav.html" %}

<main class="max-w-5xl mx-auto px-6 py-8">
  <div>
    <a href="/keyholder/submissives/{{ submissive_id }}" class="text-xs text-slate-500 hover:text-slate-300">&larr; Back to {{ submissive_display_name }}</a>
  </div>

  <div class="flex items-center justify-between mt-3 mb-6">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">{{ submissive_display_name }}'s statistics</h1>
      <p class="text-sm text-slate-400 mt-1">Exactly what {{ submissive_display_name }} sees on their own statistics page — same numbers, same shape, read-only here</p>
    </div>
    <select id="period-select" class="bg-slate-900 border border-slate-800 rounded-lg text-sm px-3 py-2 text-slate-200">
      <option value="all" selected>All time</option>
      <option value="365d">Last 12 months</option>
      <option value="90d">Last 90 days</option>
      <option value="30d">Last 30 days</option>
    </select>
  </div>

  <div id="stats-root" data-endpoint="/api/v1/keyholder/submissives/{{ submissive_id }}/stats" data-best-label="Personal best, all time">
    <p class="text-sm text-slate-500">Loading…</p>
  </div>
</main>

<script src="/static/js/statistics.js"></script>
</body>
</html>
