<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
<title>Owner's Cock Ledger — Reset Password</title>
<link href="/static/css/fonts.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet">
<script src="/static/js/jquery.min.js"></script>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100">
  <div class="min-h-full flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <img src="/static/images/logo.png" class="mx-auto h-20 w-auto mb-4" alt="Owner's Cock Ledger" />
        <h1 class="text-xl font-semibold tracking-tight">Reset your password</h1>
        <p class="text-sm text-slate-400 mt-1">Paste the reset token a server admin gave you, and choose a new password</p>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <form id="reset-form" class="space-y-4">
          <div id="reset-message" class="hidden rounded-lg px-3 py-2 text-xs"></div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5" for="token">Reset token</label>
            <input id="token" name="token" type="text" placeholder="paste the token you were given"
              class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-sm text-slate-100 placeholder-slate-600 font-mono focus:outline-none focus:ring-2 focus:ring-amber-600/60 focus:border-amber-600/60" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5" for="new_password">New password</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" placeholder="••••••••••"
              class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-600/60 focus:border-amber-600/60" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5" for="confirm_password">Confirm new password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" placeholder="••••••••••"
              class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-600/60 focus:border-amber-600/60" />
          </div>

          <button id="reset-submit-btn" type="submit" class="w-full rounded-lg bg-amber-600 hover:bg-amber-500 transition-colors py-2.5 text-sm font-semibold text-slate-950">
            Set new password
          </button>

          <p class="text-xs text-center text-slate-500 pt-1">
            <a href="/login" class="text-amber-500 hover:text-amber-400 font-medium">&larr; Back to sign in</a>
          </p>
        </form>

        <div id="reset-success" class="hidden text-center space-y-4">
          <p class="text-sm text-emerald-400">Password updated. Every other session on this account has been signed out.</p>
          <a href="/login" class="inline-block w-full rounded-lg bg-amber-600 hover:bg-amber-500 transition-colors py-2.5 text-sm font-semibold text-slate-950">
            Sign in
          </a>
        </div>
      </div>
    </div>
  </div>

<script>
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function showMessage(text, tone) {
    const cls = tone === 'error'
      ? 'bg-red-600/10 border border-red-600/30 text-red-300'
      : 'bg-emerald-600/10 border border-emerald-600/30 text-emerald-300';
    $('#reset-message').attr('class', 'rounded-lg px-3 py-2 text-xs ' + cls).removeClass('hidden').text(text);
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('token')) $('#token').val(params.get('token'));

  $('#reset-form').on('submit', function (e) {
    e.preventDefault();
    $('#reset-message').addClass('hidden');

    const newPassword = $('#new_password').val();
    if (newPassword !== $('#confirm_password').val()) {
      showMessage('Those two passwords don\'t match.', 'error');
      return;
    }

    $('#reset-submit-btn').prop('disabled', true).text('Setting password…');
    $.ajax({
      url: '/api/v1/auth/password-reset/redeem',
      method: 'POST',
      contentType: 'application/json',
      headers: { 'X-CSRF-Token': getCookie('ocl_csrf') || '' },
      data: JSON.stringify({ token: $('#token').val(), new_password: newPassword }),
    }).done(function () {
      $('#reset-form').addClass('hidden');
      $('#reset-success').removeClass('hidden').addClass('panel-fade');
    }).fail(function (xhr) {
      const msg = (xhr.responseJSON && xhr.responseJSON.error && xhr.responseJSON.error.message) || 'That token is invalid or has expired.';
      showMessage(msg, 'error');
      $('#reset-submit-btn').prop('disabled', false).text('Set new password');
    });
  });
</script>
</body>
</html>
