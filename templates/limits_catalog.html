<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
<title>Owner's Cock Ledger — Limits Catalog</title>
<link href="/static/css/fonts.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet">
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/app-shell.js"></script>
<script src="/static/js/notifications.js" defer></script>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100">

{% include "partials/nav.html" %}

<main class="max-w-3xl mx-auto px-6 py-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Limits Catalog</h1>
      <p class="text-sm text-slate-400 mt-1">What a submissive can rate as hard/soft/okay. Global items ship with every deployment; add your own house rules below.</p>
    </div>
    <button id="new-btn" class="rounded-lg bg-amber-600 hover:bg-amber-500 transition-colors px-4 py-2 text-sm font-semibold text-slate-950 shrink-0">+ Add item</button>
  </div>

  <div id="new-form" class="hidden rounded-xl border border-amber-700/40 bg-amber-500/5 p-5 mb-6 space-y-3">
    <p class="text-xs font-semibold uppercase tracking-wide text-amber-500">New item</p>
    <div id="form-message" class="hidden rounded-lg px-3 py-2 text-xs"></div>
    <div class="grid grid-cols-2 gap-3">
      <input id="form-category" type="text" placeholder="Category (e.g. House rules)" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
      <input id="form-label" type="text" placeholder="Label (e.g. No phone during scenes)" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200" />
    </div>
    <textarea id="form-description" rows="2" placeholder="Description (optional)" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200"></textarea>
    <div class="flex justify-end gap-2">
      <button id="cancel-new" type="button" class="text-xs font-medium text-slate-400 px-3 py-2">Cancel</button>
      <button id="save-btn" class="text-xs font-semibold text-slate-950 bg-amber-600 hover:bg-amber-500 rounded-lg px-4 py-2">Save item</button>
    </div>
  </div>

  <div id="item-list" class="space-y-6">
    <div class="text-center text-sm text-slate-500 py-6">Loading…</div>
  </div>
</main>

<script>

  $('#new-btn').on('click', function () {
    $('#form-message').addClass('hidden');
    $('#form-category, #form-label, #form-description').val('');
    $('#new-form').removeClass('hidden').addClass('panel-fade')[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('#cancel-new').on('click', () => $('#new-form').addClass('hidden'));

  $('#save-btn').on('click', function () {
    const category = $('#form-category').val().trim();
    const label = $('#form-label').val().trim();
    if (!category || !label) {
      $('#form-message').attr('class', 'rounded-lg px-3 py-2 text-xs bg-red-600/10 border border-red-600/30 text-red-300').text('Category and label are both required.').removeClass('hidden');
      return;
    }
    apiCall('POST', '/api/v1/keyholder/limit-items', {
      category: category, label: label, description: $('#form-description').val() || null,
    }).done(function () {
      $('#new-form').addClass('hidden');
      loadItems();
    }).fail(function (xhr) {
      $('#form-message').attr('class', 'rounded-lg px-3 py-2 text-xs bg-red-600/10 border border-red-600/30 text-red-300').text(errorMessage(xhr, 'Could not save item.')).removeClass('hidden');
    });
  });

  function itemRow(item) {
    const $row = $('<div class="flex items-center justify-between px-4 py-3">');
    const $left = $('<div>');
    $left.append($('<p class="text-sm font-medium">').text(item.label));
    if (item.description) $left.append($('<p class="text-xs text-slate-500 mt-0.5">').text(item.description));
    $row.append($left);

    const $right = $('<div class="flex items-center gap-2 shrink-0">');
    if (item.is_global) {
      $right.append($('<span class="text-[11px] text-slate-500">').text('global'));
    } else {
      if (!item.active) $right.append($('<span class="text-[11px] text-slate-500">').text('inactive'));
      const $toggle = item.active
        ? $('<button class="text-xs font-medium text-slate-400 hover:text-red-400">').text('Deactivate')
        : $('<button class="text-xs font-semibold text-amber-500 border border-amber-700/50 hover:bg-amber-500/10 rounded-lg px-2.5 py-1">').text('Reactivate');
      $toggle.on('click', function () {
        apiCall('PATCH', '/api/v1/keyholder/limit-items/' + item.id, { active: !item.active }).done(loadItems);
      });
      $right.append($toggle);
    }
    $row.append($right);
    return $row;
  }

  function loadItems() {
    apiCall('GET', '/api/v1/keyholder/limit-items').done(function (list) {
      const $list = $('#item-list').empty();
      if (list.length === 0) {
        $list.append($('<div class="text-center text-sm text-slate-500 py-6">').text('No limit items yet.'));
        return;
      }
      const byCategory = {};
      list.forEach(function (item) {
        (byCategory[item.category] = byCategory[item.category] || []).push(item);
      });
      Object.keys(byCategory).sort().forEach(function (category) {
        const $section = $('<div>');
        $section.append($('<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">').text(category));
        const $rows = $('<div class="rounded-xl border border-slate-800 bg-slate-900 divide-y divide-slate-800">');
        byCategory[category].forEach(function (item) { $rows.append(itemRow(item)); });
        $section.append($rows);
        $list.append($section);
      });
    });
  }
  loadItems();
</script>
</body>
</html>
