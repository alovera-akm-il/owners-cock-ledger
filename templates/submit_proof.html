<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
<title>Owner's Cock Ledger — Submit Proof</title>
<link href="/static/css/fonts.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet">
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/app-shell.js"></script>
<script src="/static/js/notifications.js" defer></script>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100">

{% include "partials/nav.html" %}

<main class="max-w-2xl mx-auto px-6 py-8">
  <h1 class="text-xl font-semibold tracking-tight mb-1">Submit proof</h1>

  <div class="bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 mb-6 text-sm">
    <p id="code-status-text" class="text-slate-400">
      {% if let Some(code) = current_code %}
        Write <code id="code-value" class="font-mono text-emerald-300">{{ code }}</code> somewhere visible in your photo or video, then upload it below.
      {% else %}
        No active verification code — this will be saved as an unscheduled note.
      {% endif %}
    </p>
    <p id="code-countdown" class="text-xs text-slate-500 mt-1{% if current_code_expires_at_epoch.is_none() %} hidden{% endif %}"
      data-target-epoch="{% if let Some(expires_epoch) = current_code_expires_at_epoch %}{{ expires_epoch }}{% endif %}"
      data-server-now-epoch="{{ server_now_epoch }}"></p>
    <div id="request-code-action" class="mt-2{% if current_code.is_some() %} hidden{% endif %}">
      <button id="request-new-code-btn" type="button" class="text-xs font-semibold text-slate-950 bg-amber-600 hover:bg-amber-500 rounded-lg px-3 py-1.5">Request a code</button>
      <p id="request-code-message" class="hidden mt-2 text-xs"></p>
    </div>
  </div>
  <input type="hidden" id="current-code-id" value="{% if let Some(id) = current_code_id %}{{ id }}{% endif %}" />

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
    <form id="proof-form" class="space-y-4">
      <div id="proof-message" class="hidden rounded-lg px-3 py-2 text-xs"></div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5" for="kind">Type</label>
        <select id="kind" class="w-full bg-slate-950 border border-slate-800 rounded-lg text-sm p-2 text-slate-200">
          <option value="photo">Photo</option>
          <option value="video">Video</option>
          <option value="note">Note only (no file)</option>
        </select>
      </div>

      <div id="file-field">
        <label class="block text-xs font-medium text-slate-400 mb-1.5" for="file">File</label>
        <input id="file" type="file" accept="image/jpeg,image/png,video/mp4,video/webm"
          class="w-full text-sm text-slate-300 file:mr-3 file:rounded-lg file:border-0 file:bg-slate-800 file:px-3 file:py-2 file:text-slate-200 file:text-xs" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5" for="notes">Notes (optional)</label>
        <textarea id="notes" rows="3" placeholder="anything your Keyholder should know"
          class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-600/60 focus:border-amber-600/60"></textarea>
      </div>

      <button id="submit-btn" type="submit" class="w-full rounded-lg bg-amber-600 hover:bg-amber-500 transition-colors py-2.5 text-sm font-semibold text-slate-950">
        Submit
      </button>
    </form>
  </div>
</main>

<script>

  $('#kind').on('change', function () {
    $('#file-field').toggle($(this).val() !== 'note');
  });

  let codeTickInterval = null;

  function showCodeExpired() {
    if (codeTickInterval) clearInterval(codeTickInterval);
    $('#code-status-text').text('No active verification code — this will be saved as an unscheduled note.');
    $('#code-countdown').addClass('hidden');
    $('#current-code-id').val('');
    $('#request-code-action').removeClass('hidden');
  }

  function startCodeCountdown(targetEpoch, serverNowEpoch) {
    const el = document.getElementById('code-countdown');
    if (!el) return;
    if (codeTickInterval) clearInterval(codeTickInterval);
    const loadedAtClientMs = Date.now();

    function fmt(seconds) {
      seconds = Math.max(0, Math.round(seconds));
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return minutes + 'm ' + secs + 's';
    }

    function tick() {
      const elapsedSinceLoad = (Date.now() - loadedAtClientMs) / 1000;
      const remaining = (targetEpoch - serverNowEpoch) - elapsedSinceLoad;
      if (remaining <= 0) {
        showCodeExpired();
        return;
      }
      el.textContent = 'expires in ' + fmt(remaining);
    }
    tick();
    codeTickInterval = setInterval(tick, 1000);
  }

  (function () {
    const el = document.getElementById('code-countdown');
    if (!el || !el.dataset.targetEpoch) return;
    startCodeCountdown(parseInt(el.dataset.targetEpoch, 10), parseInt(el.dataset.serverNowEpoch, 10));
  })();

  $('#request-new-code-btn').on('click', function () {
    $('#request-code-message').addClass('hidden');
    $(this).prop('disabled', true);
    $.ajax({
      url: '/api/v1/submissive/verification-codes',
      method: 'POST',
      headers: { 'X-CSRF-Token': getCookie('ocl_csrf') || '' },
    }).done(function (code) {
      $('#current-code-id').val(code.id);
      $('#code-status-text').html('Write <code id="code-value" class="font-mono text-emerald-300"></code> somewhere visible in your photo or video, then upload it below.');
      $('#code-value').text(code.code);
      $('#request-code-action').addClass('hidden');
      const expiresEpoch = Math.floor(new Date(code.expires_at).getTime() / 1000);
      $('#code-countdown').removeClass('hidden');
      startCodeCountdown(expiresEpoch, Math.floor(Date.now() / 1000));
    }).fail(function (xhr) {
      const msg = (xhr.responseJSON && xhr.responseJSON.error && xhr.responseJSON.error.message) || 'Could not request a code right now.';
      $('#request-code-message').removeClass('hidden').text(msg);
    }).always(function () {
      $('#request-new-code-btn').prop('disabled', false);
    });
  });

  $('#proof-form').on('submit', function (e) {
    e.preventDefault();
    $('#proof-message').addClass('hidden');

    const kind = $('#kind').val();
    const fileInput = $('#file')[0];
    if (kind !== 'note' && fileInput.files.length === 0) {
      $('#proof-message').attr('class', 'rounded-lg px-3 py-2 text-xs bg-red-600/10 border border-red-600/30 text-red-300').text('Choose a file, or switch to "Note only".');
      return;
    }

    const formData = new FormData();
    const codeId = $('#current-code-id').val();
    if (codeId) {
      formData.append('verification_code_id', codeId);
    }
    formData.append('kind', kind);
    const notes = $('#notes').val();
    if (notes) {
      formData.append('metadata', JSON.stringify({ notes: notes }));
    }
    if (fileInput.files.length > 0) {
      formData.append('files', fileInput.files[0]);
    }

    $('#submit-btn').prop('disabled', true).text('Submitting…');
    $.ajax({
      url: '/api/v1/submissive/proof-submissions',
      method: 'POST',
      data: formData,
      processData: false,
      contentType: false,
      headers: { 'X-CSRF-Token': getCookie('ocl_csrf') || '' },
    }).done(function () {
      window.location = '/submissive';
    }).fail(function (xhr) {
      const msg = (xhr.responseJSON && xhr.responseJSON.error && xhr.responseJSON.error.message) || 'Something went wrong.';
      $('#proof-message').attr('class', 'rounded-lg px-3 py-2 text-xs bg-red-600/10 border border-red-600/30 text-red-300').text(msg);
      $('#submit-btn').prop('disabled', false).text('Submit');
    });
  });
</script>
</body>
</html>
